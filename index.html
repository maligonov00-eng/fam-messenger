  function legacyMessageTimestamp(value,index=0){const now=new Date(),label=String(value||"").trim().toLowerCase(),clock=label.match(/^(\d{1,2}):(\d{2})$/);if(clock){const date=new Date(now);date.setHours(Number(clock[1]),Number(clock[2]),0,0);return date.getTime()}if(label==="сейчас")return Date.now()-index*1000;const date=new Date(now);date.setHours(12,0,0,0);if(label==="вчера"){date.setDate(date.getDate()-1);return date.getTime()}const dayIndex=weekdayShort.indexOf(label);if(dayIndex>=0){let offset=(date.getDay()-dayIndex+7)%7;if(offset===0)offset=7;date.setDate(date.getDate()-offset);return date.getTime()}return Date.now()-index*60000}

  function renderChats(){
    const host=byId("chatList");
    const query=byId("searchChats").value.trim().toLowerCase();

    state.chats.sort((a,b)=>Number(Boolean(b.pinned))-Number(Boolean(a.pinned))||latestChatActivity(b)-latestChatActivity(a));

  function confirmDestructiveAction(title,description,confirmLabel="Удалить"){
    return new Promise(resolve=>{
      const backdrop=byId("modalBack");
      const content=byId("modalContent");
      let settled=false;

      const finish=confirmed=>{
        if(settled)return;
        settled=true;
        backdrop.classList.remove("open");
        backdrop.onclick=null;
        document.removeEventListener("keydown",onKeyDown);
        resolve(confirmed);
      };
      const onKeyDown=event=>{
        if(event.key==="Escape")finish(false);
      };

      content.innerHTML=`
        <h3 id="deleteChatTitle">${escapeHTML(title)}</h3>
        <p>${escapeHTML(description)}</p>
        <div class="modal-actions">
          <button class="secondary-btn" id="cancelChatDelete" type="button">Отмена</button>
          <button class="primary-btn danger-btn" id="confirmChatDelete" type="button">${escapeHTML(confirmLabel)}</button>

      left=frameSize/2-(frameSize/2-left)*ratio;top=frameSize/2-(frameSize/2-top)*ratio;zoom=nextZoom;layout();
    };
    frame.onpointerdown=event=>{dragging=true;startX=event.clientX;startY=event.clientY;startLeft=left;startTop=top;try{frame.setPointerCapture(event.pointerId)}catch{}};
    frame.onpointermove=event=>{if(!dragging)return;left=startLeft+event.clientX-startX;top=startTop+event.clientY-startY;layout()};
    frame.onpointerup=()=>{dragging=false};frame.onpointercancel=()=>{dragging=false};
    byId("saveAvatarCrop").onclick=()=>{
      const scale=baseScale*zoom,sourceSize=frameSize/scale,sourceX=-left/scale,sourceY=-top/scale,canvas=document.createElement("canvas");canvas.width=512;canvas.height=512;
      const context=canvas.getContext("2d");context.drawImage(image,sourceX,sourceY,sourceSize,sourceSize,0,0,512,512);
      try{state.user.photo=canvas.toDataURL("image/jpeg",.86);persist();refreshSidebarProfile();cleanup();nav("profile");toast("Фото профиля обновлено")}
      catch{toast("Не удалось обработать это изображение")}
    };
    byId("cancelAvatarCrop").focus();
  }
  document.addEventListener("change",event=>{
    if(event.target.id!=="avatarFile")return;
    const file=event.target.files?.[0];if(!file)return;
    if(!file.type.startsWith("image/")){toast("Выберите файл изображения");event.target.value="";return}
    const sourceUrl=URL.createObjectURL(file),image=new Image();
    image.onload=()=>openAvatarCrop(image,sourceUrl);
    image.onerror=()=>{URL.revokeObjectURL(sourceUrl);event.target.value="";toast("Не удалось открыть это изображение")};
    image.src=sourceUrl;
  });
  migrateLegacyTimestamps();persist();byId("railName").textContent=state.user.name;refreshSidebarProfile();setTheme(state.theme);renderChats();renderMessages();nav("chats");
  </script>
</body>
</html>
