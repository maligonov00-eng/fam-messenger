    else if(page==="groupMembers"){const c=current(),members=c.members||[];html=`<button class="page-back" id="groupBack"><svg class="back-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Назад</button><h1 class="page-title">Участники</h1><p class="page-sub">${escapeHTML(c.name)} · ${members.length} участников</p><div class="panel-card"><button class="secondary-btn" id="addGroupPeopleBtn">＋ Добавить участников</button><div class="panel-card group-create-panel" id="addGroupPeoplePanel" hidden><label class="search"><svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.2 4.2"/></svg><input id="addMemberSearch" placeholder="Поиск по юзернейму"></label><div class="group-search-results" id="addMemberResults"></div><div class="selected-member-chips" id="addSelectedMembers"></div><button class="primary-btn" id="confirmGroupPeopleBtn">Добавить выбранных</button></div><div class="group-members">${members.map(name=>{const person=state.contacts.find(x=>x.name===name)||{},login=person.login||(name===state.user.name?state.user.login:name.toLowerCase().replace(/\s/g,"")),cls=person.cls||(name===state.user.name?"a2":"");return `<button class="group-member-button" data-user="${escapeHTML(name)}">${avatar(name[0],cls)}<span class="group-member-meta"><strong>${escapeHTML(name)}${name===state.user.name?" · вы":""}</strong><small>@${escapeHTML(login)}${isPersonOnline(name)?" · в сети":""}</small></span></button>`}).join("")}</div></div>`}
    else if(page==="owner"){html=`<div class="eyebrow">Управление пространством</div><h1 class="page-title">Панель владельца</h1><p class="page-sub">Настройки семейного пространства</p><div class="profile-grid"><div class="panel-card"><div class="contact-name">Семья Малигиных</div><div class="setting-row"><span>Участники</span><strong>${state.accounts.length}</strong></div><div class="setting-row"><span>Регистрация</span><span class="pill">Открыта</span></div><div class="setting-row"><span>Администратор</span><span class="pill">Владелец семьи</span></div></div><div class="panel-card"><div class="contact-name">Регистрация FAM</div><p class="page-sub" style="margin:8px 0 0">Новые участники могут создать аккаунт и сразу войти. Юзернеймы должны быть уникальными и состоять из латинских букв и цифр.</p></div></div>`}
    byId("pagePanel").innerHTML=html;const toggle=byId("themeToggle");if(toggle)toggle.onchange=()=>setTheme(toggle.checked?"dark":"light");const save=byId("saveProfile");if(save)save.onclick=()=>{const rawUsername=byId("profileUsername").value.trim(),username=normalizeUsername(rawUsername);if(!validUsername(rawUsername)){toast("Юзернейм: только латинские буквы и цифры");return}if(usernameTaken(username,true)){toast("Этот юзернейм уже занят");return}const oldName=state.user.name,oldLogin=state.user.login,newName=byId("profileName").value.trim()||oldName;state.user.name=newName;state.user.login=username;const account=state.accounts.find(a=>normalizeUsername(a.login)===normalizeUsername(oldLogin));if(account){account.name=newName;account.login=username}const ownContact=state.contacts.find(c=>c.name===oldName&&normalizeUsername(c.login)===normalizeUsername(oldLogin));if(ownContact){ownContact.name=newName;ownContact.login=username}refreshSidebarProfile();persist();nav("profile");toast("Профиль обновлён")};const logout=byId("logoutBtn");if(logout)logout.onclick=()=>showAuth("login");const returnToChat=byId("returnToChat");if(returnToChat)returnToChat.onclick=()=>openContactChat(viewedUser.name);const userProfileBack=byId("userProfileBack");if(userProfileBack)userProfileBack.onclick=()=>nav("chats");const groupBack=byId("groupBack");if(groupBack)groupBack.onclick=()=>nav("chats");const blockUser=byId("blockUserBtn");if(blockUser)blockUser.onclick=()=>{const username=normalizeUsername(viewedUser.login);if(state.blockedUsers.includes(username))state.blockedUsers=state.blockedUsers.filter(x=>x!==username);else state.blockedUsers.push(username);persist();if(current().kind==="personal")renderMessages();nav("userProfile")};const addPeopleBtn=byId("addGroupPeopleBtn");if(addPeopleBtn)addPeopleBtn.onclick=()=>{const panel=byId("addGroupPeoplePanel");panel.hidden=!panel.hidden;if(!panel.hidden){selectedAddUsers=new Set();byId("addMemberSearch").value="";refreshPersonPickers()}};const addMemberSearch=byId("addMemberSearch");if(addMemberSearch)addMemberSearch.oninput=refreshPersonPickers;const groupMemberSearch=byId("groupMemberSearch");if(groupMemberSearch)groupMemberSearch.oninput=refreshPersonPickers;const confirmPeople=byId("confirmGroupPeopleBtn");if(confirmPeople)confirmPeople.onclick=()=>{const c=current(),selected=[...selectedAddUsers],added=state.contacts.filter(person=>selected.includes(person.login)&&!c.members.includes(person.name));c.members=[...(c.members||[]),...added.map(person=>person.name)];c.online=`${c.members.length} участников`;c.updatedAt=Date.now();persist();nav("groupMembers");toast(added.length?"Участники добавлены":"Выберите людей для добавления")};const contactSearch=byId("contactSearch");if(contactSearch)contactSearch.oninput=()=>{byId("contactRows").innerHTML=contactRows(contactSearch.value);bindContactButtons(byId("contactRows"))};bindContactButtons(byId("contactRows")||document);const newGroup=byId("newGroupBtn");if(newGroup)newGroup.onclick=()=>{const box=byId("groupCreatePanel");box.hidden=!box.hidden;if(!box.hidden){selectedGroupUsers=new Set();byId("groupMemberSearch").value="";refreshPersonPickers();byId("groupName").focus()}};const cancelGroup=byId("cancelGroupBtn");if(cancelGroup)cancelGroup.onclick=()=>byId("groupCreatePanel").hidden=true;const createGroup=byId("createGroupBtn");if(createGroup)createGroup.onclick=()=>{const name=byId("groupName").value.trim(),selected=[...selectedGroupUsers],people=state.contacts.filter(person=>selected.includes(person.login));if(!name){toast("Введите название группы");return}if(!people.length){toast("Добавьте хотя бы одного участника");return}const id=`group-${Date.now()}`,members=[state.user.name,...people.map(person=>person.name)],group={id,name,kind:"group",avatar:name[0],cls:"a3",time:"сейчас",preview:"Группа создана",unread:0,online:`${members.length} участников`,members,updatedAt:Date.now()};state.chats.unshift(group);state.messages[id]=[];persist();selectChat(id)};const ownerPanel=byId("ownerPanelBtn");if(ownerPanel)ownerPanel.onclick=()=>nav("owner");}
  function setTheme(theme){state.theme=theme;document.documentElement.classList.toggle("dark",theme==="dark");persist()}
  function showAuth(mode){const layer=byId("authLayer");layer.classList.add("open");renderAuth(mode)}
  async function passwordDigest(value){
    if(!globalThis.crypto?.subtle)throw new Error("Secure hashing is unavailable");
    const bytes=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value));
    return Array.from(new Uint8Array(bytes),byte=>byte.toString(16).padStart(2,"0")).join("");
  }
  function renderAuth(mode){
    const register=mode==="register",content=byId("authContent"),layer=byId("authLayer");
    content.innerHTML=`<p>${register?"Создайте аккаунт FAM. После регистрации вы сразу войдёте.":"ВХОД"}</p><form class="form" id="authForm" novalidate>${register?`<label class="field"><span>Ваше имя</span><input name="name" placeholder="Например, Мария" autocomplete="name"></label>`:""}<label class="field"><span>Юзернейм</span><input name="login" placeholder="Ваш юзернейм" autocomplete="username" autocapitalize="none" spellcheck="false"></label><label class="field"><span>Пароль</span><input name="password" type="password" placeholder="Не менее 8 символов" autocomplete="${register?"new-password":"current-password"}"></label>${register?`<label class="field"><span>Подтвердите пароль</span><input name="confirmPassword" type="password" placeholder="Повторите пароль" autocomplete="new-password"></label>`:""}<button class="primary-btn">${register?"Зарегистрироваться":"Войти"}</button></form><button class="auth-switch" id="authSwitch">${register?"Уже есть аккаунт? Войти":"Нет аккаунта? Зарегистрироваться"}</button><div class="auth-notice" id="authNotice" role="status" aria-live="polite"></div>${!register?`<button class="auth-switch" id="demoLogin">Продолжить как демонстрационный владелец</button>`:""}`;
    byId("authSwitch").onclick=()=>renderAuth(register?"login":"register");
    if(byId("demoLogin"))byId("demoLogin").onclick=()=>{const ownerAccount=state.accounts.find(account=>account.role==="owner")||{name:"Александр",login:"alex",role:"owner"};state.user={...ownerAccount};persist();refreshSidebarProfile();layer.classList.remove("open");toast("Демо-вход: Александр")};
    byId("authForm").onsubmit=async e=>{
      e.preventDefault();
      const data=new FormData(e.currentTarget),rawUsername=String(data.get("login")||"").trim(),login=normalizeUsername(rawUsername),password=String(data.get("password")||""),notice=byId("authNotice");
      notice.textContent="";notice.classList.remove("show");
      const warn=message=>{notice.textContent=message;notice.classList.add("show")};
      if(register&&!String(data.get("name")||"").trim()){warn("Введите ваше имя.");return}
      if(!validUsername(rawUsername)){warn("Юзернейм может содержать только латинские буквы и цифры.");return}
      if(password.length<8){warn("Пароль должен содержать минимум 8 символов.");return}
      if(!/^[A-Za-z0-9!._,\-+=?]+$/.test(password)){warn("В пароле разрешены латинские буквы, цифры и символы ! . _ - , + = ?.");return}
      if(register&&password!==String(data.get("confirmPassword")||"")){warn("Пароли не совпадают.");return}
      let passwordHash;
      try{passwordHash=await passwordDigest(password)}catch{warn("Браузер не поддерживает локальную проверку пароля.");return}
      if(register){
        if(usernameTaken(login)){warn("Этот юзернейм уже занят. Выберите другой.");return}
        const name=String(data.get("name")).trim()||login,account={name,login,role:"member",passwordHash};
        state.accounts.push(account);state.contacts.push({name,login,cls:"a1"});state.user={name,login,role:"member"};persist();layer.classList.remove("open");refreshSidebarProfile();renderChats();toast("Аккаунт создан. Добро пожаловать в FAM!");
      }else{
        const account=state.accounts.find(a=>normalizeUsername(a.login)===login);
        if(!account){warn("Аккаунт не найден. Зарегистрируйтесь, чтобы войти.");return}
        if(!account.passwordHash){warn("Для демо-аккаунта используйте кнопку демонстрационного входа.");return}
        if(account.passwordHash!==passwordHash){warn("Неверный пароль.");return}
        state.user={name:account.name,login:account.login,role:account.role||"member"};persist();layer.classList.remove("open");refreshSidebarProfile();toast("Вы вошли в FAM");
      }
    };
  }
  document.addEventListener("click",e=>{if(e.target.closest("#changeAvatar"))byId("avatarFile")?.click()});
  document.addEventListener("change",e=>{if(e.target.id!=="avatarFile")return;const file=e.target.files&&e.target.files[0];if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const scale=Math.min(1,512/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);state.user.photo=canvas.toDataURL("image/jpeg",.86);URL.revokeObjectURL(url);persist();refreshSidebarProfile();nav("profile");toast("Фото профиля обновлено")};img.onerror=()=>{URL.revokeObjectURL(url);toast("Не удалось открыть это изображение")};img.src=url});
  byId("railName").textContent=state.user.name;refreshSidebarProfile();setTheme(state.theme);renderChats();renderMessages();nav("chats");
